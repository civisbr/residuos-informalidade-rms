[project]
name = "residuos-informalidade-rms"
version = "0.1.0"
description = "Painel vivo de resíduos e informalidade por município brasileiro — dado público + modelo BSF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",   # usado no refresh (IBGE/SNIS)
]

[project.scripts]
obs = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
